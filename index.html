<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlantTalk — Real Time Speaking Partner</title>
    <!-- PWA & Mobile Web App Metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d281a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Talking Plant" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/plant-talk.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit for ultra-premium liquid glass typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-stone-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
