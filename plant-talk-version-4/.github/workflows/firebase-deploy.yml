name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          if [ -d "plant-talk-version-4" ]; then
            cd plant-talk-version-4 && npm ci || npm install
          else
            npm ci || npm install
          fi

      - name: Build Application
        run: |
          if [ -d "plant-talk-version-4" ]; then
            cd plant-talk-version-4 && npm run build
          else
            npm run build
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALKINGPLANT_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: plant-talk-f0355
        continue-on-error: true

      - name: Fallback Deploy using Firebase Token
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
